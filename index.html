<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Megbli Labs — Web, Mobile & AI products</title>
  <meta name="description" content="Three-engineer software studio building web platforms, mobile apps and AI-powered systems — from idea to production.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">

  <nav class="nav">
    <div class="container nav-inner">
      <a href="index.html" class="logo">Megbli<b> Labs</b></a>
      <div class="nav-right">
        <div class="nav-links">
          <a href="#work" data-i18n="nav.work">Work</a>
          <a href="#services" data-i18n="nav.services">Services</a>
          <a href="#process" data-i18n="nav.process">Process</a>
          <a href="#team" data-i18n="nav.team">Team</a>
          <a href="#contact" data-i18n="nav.contact">Contact</a>
        </div>
        <button id="lang-toggle" class="lang-btn">العربية</button>
      </div>
    </div>
  </nav>

  <header class="hero container">
    <p class="eyebrow" data-i18n="hero.eyebrow"></p>
    <h1 data-i18n="hero.h1"></h1>
    <p class="sub" data-i18n="hero.sub"></p>
    <div class="chips-row">
      <span data-i18n="hero.c1"></span><span data-i18n="hero.c2"></span>
      <span data-i18n="hero.c3"></span><span data-i18n="hero.c4"></span>
    </div>
    <div class="hero-ctas">
      <a class="btn btn-primary" data-wa href="#" target="_blank" rel="noopener" data-i18n="hero.cta1"></a>
      <a class="btn btn-ghost" href="#work" data-i18n="hero.cta2"></a>
    </div>
    <p class="trust" data-i18n="hero.trust"></p>
  </header>

  <section id="services">
    <div class="container">
      <div class="section-head">
        <p class="eyebrow" data-i18n="services.eyebrow"></p>
        <h2 data-i18n="services.h2"></h2>
      </div>
      <div class="grid grid-3" id="services-grid"></div>
    </div>
  </section>

  <section id="work">
    <div class="container">
      <div class="section-head">
        <p class="eyebrow" data-i18n="work.eyebrow"></p>
        <h2 data-i18n="work.h2"></h2>
      </div>
      <div class="grid grid-projects" id="projects-grid"></div>
    </div>
  </section>

  <section id="process">
    <div class="container">
      <div class="section-head">
        <p class="eyebrow" data-i18n="process.eyebrow"></p>
        <h2 data-i18n="process.h2"></h2>
      </div>
      <ol class="process" id="process-list"></ol>
    </div>
  </section>

  <section id="team">
    <div class="container">
      <div class="section-head">
        <p class="eyebrow" data-i18n="team.eyebrow"></p>
        <h2 data-i18n="team.h2"></h2>
        <p class="lead" data-i18n="team.intro"></p>
      </div>
      <div class="grid grid-3" id="team-grid"></div>
    </div>
  </section>

  <section id="contact">
    <div class="container">
      <div class="contact-box">
        <p class="eyebrow" data-i18n="contact.eyebrow"></p>
        <h2 data-i18n="contact.h2"></h2>
        <p class="lead" data-i18n="contact.sub"></p>
        <div class="contact-ctas">
          <a class="btn btn-wa" data-wa href="#" target="_blank" rel="noopener" data-i18n="contact.wa"></a>
          <a class="btn btn-mail" href="mailto:yosra.meguebli@yahoo.fr?subject=Project%20inquiry" data-i18n="contact.mail"></a>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <div class="container"><p data-i18n="footer"></p></div>
  </footer>

  <a class="wa-float" data-wa href="#" target="_blank" rel="noopener" aria-label="WhatsApp">
    <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
  </a>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
